name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push replaces a run still going for the same branch: a stuck or superseded run must not hold a runner.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    # macOS on Apple silicon is the only supported platform for now. No GPU on the runner: CPU tests only.
    runs-on: macos-15 # Apple silicon (the hosted runner has a fixed 7 GB of memory: not configurable)
    timeout-minutes: 30 # a normal run takes 8 to 12; GitHub's default of 360 let a stuck build run for 40+
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: brew install ninja shaderc vulkan-headers vulkan-loader molten-vk clang-format llvm
      - name: Version
        run: scripts/version.sh check
      - name: Format
        run: find src apps tests -name '*.cpp' -o -name '*.hpp' | xargs clang-format --dry-run --Werror
      - name: Build (warnings are errors, ASan and UBSan)
        timeout-minutes: 20
        run: |
          cmake --preset ci
          cmake --build --preset ci
      - name: clang-tidy (bugprone, performance and analyzer findings are errors; see .clang-tidy)
        run: scripts/tidy.sh # canary, file count and the ratchet are inside the script
      - name: CPU tests
        timeout-minutes: 15
        run: ctest --preset ci -L '^cpu$' --timeout 600 # the whole CPU suite is one ctest test (about 5 minutes): 10 minutes is the ceiling

  plugin:
    runs-on: ubuntu-22.04 # Python 3.9 (KiCAD's interpreter) is not offered on newer images
    timeout-minutes: 15 # a normal run takes about 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9" # KiCAD's bundled interpreter
      - run: pip install pytest pytest-bdd pytest-cov ruff "kicad-python==0.8.0" # the tests import kipy through kicad_reader
      - working-directory: plugin
        run: |
          ruff check .
          ruff format --check .
          pytest -q --cov=emfdtd_plugin --cov-fail-under=72 # measured 74 percent on 2026-11-27: a floor, not a goal
      - run: python3 scripts/bdd_check.py # BDD conformance: every scenario has a Then, no new bare tests
