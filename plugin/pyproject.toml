[project]
name = "emfdtd-plugin"
version = "0.1.0"
description = "KiCAD IPC plugin side of kicad-em-fdtd (runs on KiCAD's bundled Python 3.9)"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest", "pytest-bdd", "pytest-cov", "ruff"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py39"
line-length = 110
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "C901"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["C901"]  # test fakes may branch

[tool.ruff.lint.mccabe]
max-complexity = 15  # a ratchet: the six functions above it carry a noqa and must not grow
